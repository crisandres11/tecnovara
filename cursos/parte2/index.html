<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos, parte 2 · TECNOVARA</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2f5bff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f4f6fb;--surf:#fff;--ink:#14213d;--mut:#4d5a78;--line:#d9dfec;--acc:#2f5bff;--acc2:#ffc93c;--onacc:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1730;--surf:#18223f;--ink:#eef1fa;--mut:#a9b4d0;--line:#2c3860;--acc:#7b97ff;--onacc:#0f1730}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Source Sans 3",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0 0 10px;font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.02em}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.top{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.in{max-width:820px;margin:auto;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 21px "Bricolage Grotesque",sans-serif;color:var(--ink);text-decoration:none}
.logo img{width:28px;height:28px;border-radius:6px}.logo b{color:var(--acc)}
.in a.b{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
main{max-width:820px;margin:auto;padding:48px 20px 60px}
p{color:var(--mut);max-width:56ch}
.btn{display:inline-block;background:var(--acc);color:var(--onacc);font:600 17px "Source Sans 3",sans-serif;border-radius:10px;padding:12px 22px;text-decoration:none;margin-top:10px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="/"><img src="/favicon.ico" alt=""><span>TECNO<b>VARA</b></span></a>
  <a class="b" href="/cursos/">← Cursos</a>
</div></header>
<main>
  <h1>Cursos, parte 2</h1>
  <p>Aquí estarán los cursos más avanzados de TECNOVARA. Estamos preparándolos y pronto los verás aquí.</p>
  <a class="btn" href="/cursos/">Volver a los cursos</a>
</main>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}</script>
</body>
</html>
