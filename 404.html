<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · TECNOVARA</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
/* Las direcciones /prueba/curso/ID no son archivos reales: se envían a /prueba/, que las interpreta. */
(function(){
  var p=location.pathname;
  if(/^\/prueba\/[^\/]+\/[^\/]+\/?$/.test(p)){location.replace("/prueba/?p="+encodeURIComponent(p))}
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font:18px/1.6 system-ui,sans-serif;background:#f4f6fb;color:#14213d;text-align:center;padding:24px}
@media(prefers-color-scheme:dark){body{background:#0f1730;color:#eef1fa}}
a{display:inline-block;margin-top:14px;background:#2f5bff;color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:12px 24px}
</style>
</head>
<body>
<main>
  <h1>Página no encontrada</h1>
  <p>No encontramos lo que buscas.</p>
  <a href="/">Ir al inicio</a>
</main>
</body>
</html>
